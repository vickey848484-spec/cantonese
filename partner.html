<body>
  <main class="container container-wide">
    <section class="section">
      <div class="center mb-3">
        <h1 class="display"><i data-icon="handshake"></i> <span data-i18n="partner.title">揾你嘅粵語語伴</span></h1>
        <p class="muted mt-1" id="subtitle" data-i18n="partner.subtitle-base">按你嘅等級篩嘅 3-5 位</p>
      </div>

      <div class="card-flat mb-3 hide" id="no-result">
        <p data-i18n="result.no-result">你未測試過 <a href="test.html" style="color: var(--blue);" data-i18n="result.to-test">→ 去測一測</a></p>
      </div>

      <div id="partner-list" class="grid grid-2"></div>

      <div class="center mt-3">
        <a class="btn btn-ghost" href="result.html" data-i18n="btn.view-result">← 睇返結果</a>
        <a class="btn btn-primary" href="course.html" data-i18n="btn.find-course-arrow">下一步：揾課 →</a>
      </div>
    </section>
  </main>

  <footer class="footer" data-i18n="footer.main">識講粵語 · 由 Vickey 老師主理</footer>

  <script src="js/common.js?v=20260607b"></script>
  <script src="js/labeler.js?v=20260607b"></script>
  <script>
    Cantonese.initTheme();
    Cantonese.injectThemeToggle();
    Cantonese.injectTopbar('partner');
    Cantonese.initIcons();
    Cantonese.initScrollReveal();
    Cantonese.applyI18n();

    (async function () {
      try {
        const result = Cantonese.Store.get(Cantonese.Store.KEYS.result);
        if (!result) {
          document.getElementById('no-result').classList.remove('hide');
          document.getElementById('partner-list').innerHTML = '';
          return;
        }

        const { level, mbtiCode } = result;
        let mbtiType = null;
        try {
          await Labeller.load();
          mbtiType = Labeller.resolve(mbtiCode);
        } catch (e) {
          console.warn('[partner] labels.json 加載失敗，用 fallback', e);
        }
        const matchTags = (mbtiType && mbtiType.matchTags) || [];

        const { partners } = await Cantonese.loadJSON('data/partners.json');

        // matchTags 和 p.tags 现在都是多语数组，按当前语言取
        const matchTagsL = Cantonese.pick(matchTags) || [];
        const lang = Cantonese.getLang();
        const T = Cantonese.t;

        const scored = partners.map(p => {
          let score = 0;
          if (Cantonese.pick(p.level, lang) === level.short) score += 10;
          const pTags = Cantonese.pick(p.tags, lang) || [];
          pTags.forEach(t => { if (matchTagsL.includes(t)) score += 3; });
          return { ...p, _score: score };
        }).sort((a, b) => b._score - a._score).slice(0, 5);

        document.getElementById('subtitle').textContent =
          T('partner.subtitle-count', undefined, level.name, scored.length) +
          (mbtiType ? T('partner.matched') : '');

        const host = document.getElementById('partner-list');
        host.innerHTML = scored.map(p => {
          return `
          <div class="partner-card">
            <div class="row" style="gap:14px; align-items: center;">
              <span class="partner-avatar">
                <span class="partner-avatar-emoji">${p.icon || '🧑'}</span>
              </span>
              <div>
                <div class="partner-name">${Cantonese.pick(p.name, lang)}</div>
                <div class="partner-meta">${Cantonese.pick(p.gender, lang)} · ${p.age} · ${Cantonese.pick(p.region, lang)}</div>
              </div>
            </div>
            <div class="row" style="gap:6px;">
              <span class="tag tag-pink">${Cantonese.pick(p.level, lang)}</span>
              ${Cantonese.pick(p.tags, lang).map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            <p class="partner-intro">${Cantonese.pick(p.intro, lang)}</p>
            <div class="text-sm muted">${Cantonese.icon('envelope-simple')} ${p.contact}</div>
          </div>
        `}).join('');
      } catch (e) {
        console.error('[partner] error:', e);
        document.getElementById('no-result').classList.remove('hide');
        document.getElementById('no-result').innerHTML =
          `<p style="color: var(--pink); margin-bottom: 8px;">${Cantonese.t('result.error-title')}</p>
           <p class="text-sm muted" style="margin-bottom: 16px;">${e.message}</p>
           <a class="btn btn-ghost" href="test.html">${Cantonese.t('result.error-cta')}</a>`;
      }
    })();
  </script>
</body>
