  <style>
    .qa-search {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      background: var(--bg-soft);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .qa-search:focus { outline: none; border-color: var(--yellow); }
    .qa-search::placeholder { color: var(--text-soft); font-weight: 400; }

    .qa-category { margin-bottom: 32px; }
    .qa-cat-title {
      font-size: 22px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qa-cat-title i { color: var(--blue); }
    details.qa-item summary {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    details.qa-item {
      background: var(--card);
      color: var(--card-text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    details.qa-item:hover { border-color: var(--border-strong); }
    details.qa-item[open] { border-color: var(--yellow); }
    details.qa-item summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }
    details.qa-item summary::-webkit-details-marker { display: none; }
    details.qa-item summary::before {
      content: '+';
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: var(--yellow);
      color: #0a0a0a;
      border-radius: 4px;
      font-weight: 900;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }
    details.qa-item[open] summary::before { content: '−'; }
    details.qa-item .qa-q-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--yellow);
      color: #0a0a0a;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    details.qa-item .qa-q-text { flex: 1; }
    details.qa-item .qa-a {
      margin-top: 12px;
      padding-left: 36px;
      color: var(--text-soft);
      line-height: 1.7;
      font-size: 15px;
    }

    .contact-card {
      background: var(--card);
      color: var(--card-text);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-top: 32px;
    }
    .contact-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    @media (min-width: 640px) {
      .contact-row { grid-template-columns: repeat(3, 1fr); }
    }
    .contact-item {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }
    .contact-item .icon-wrap {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--yellow);
      color: #0a0a0a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .contact-item .icon-wrap i { font-size: 28px; color: #0a0a0a; }
    .contact-item .label { font-size: 13px; color: var(--text-soft); margin-bottom: 4px; }
    .contact-item .value { font-weight: 900; font-size: 16px; }
    .contact-item .copy-btn {
      margin-top: 12px;
      padding: 6px 14px;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      cursor: pointer;
    }
    .contact-item .copy-btn:hover { background: var(--yellow); color: #0a0a0a; border-color: var(--yellow); }
  </style>
</head>
<body>
  <main class="container">
    <section class="section">
      <div class="center mb-3">
        <h1 class="display" data-i18n="qa.title">學習 Q&A + 客服</h1>
        <p class="muted mt-1" data-i18n="qa.subtitle">唔怕問題多，怕你唔問</p>
      </div>

      <input class="qa-search" type="search" id="qa-filter" data-i18n-placeholder="qa.placeholder" placeholder="搜問題：例如「發音」「多久」「退款」…">

      <div id="qa-list"></div>

      <div class="contact-card">
        <h2 class="display" style="font-size: 22px;" data-i18n="qa.contact-h2">📞 聯繫客服</h2>
        <p class="muted text-sm mt-1" data-i18n="qa.contact-sub">3 種方式揾到 Vickey 老師</p>

        <div class="contact-row" id="contact-rows">
          <!-- JS 渲染 -->
        </div>

        <div class="mt-3" style="background: var(--bg-soft); padding: 16px; border-radius: 12px; border: 1px solid var(--border);">
          <div class="text-sm bold"><i class="ph ph-clock"></i> <span data-i18n="qa.contact-hours">客服時間</span></div>
          <p class="muted text-sm mt-1" id="contact-hours">—</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">識講粵語 · 由 Vickey 老師主理</footer>

  <!-- FAQPage 结构化数据（Google 搜索 rich result） -->
  <script>
  (function() {
    var lang = (new URLSearchParams(location.search).get('lang')) || localStorage.getItem('cantonese_lang') || 'zh-CN';
    if (!['zh-HK','zh-CN','en'].indexOf(lang) === false) lang = 'zh-CN';
    fetch('data/i18n.json').then(function(r){return r.json();}).then(function(d){
      var list = (d.qa||[]).map(function(item){
        return {
          '@type': 'Question',
          'name': item.q[lang] || item.q['zh-CN'] || '',
          'acceptedAnswer': {
            '@type': 'Answer',
            'text': (item.a[lang] || item.a['zh-CN'] || '').replace(/<[^>]+>/g,'')
          }
        };
      });
      var ld = {
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        'mainEntity': list
      };
      var s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify(ld);
      document.head.appendChild(s);
    }).catch(function(e){console.warn('[FAQ JSON-LD] fail', e);});
  })();
  </script>
  <script src="js/common.js?v=20260608c"></script>

  <!-- FAQPage 静态 fallback（动态 i18n 加载失败时仍可被搜索引擎读取）-->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      { "@type": "Question", "name": "學粵語要學幾耐？", "acceptedAnswer": { "@type": "Answer", "text": "按 FSI 標準，中文被列為「超難」語言，母語英語者達到 B1 需約 2200 小時。本網站用年齡/地域/每日學習時長算精確值。" } },
      { "@type": "Question", "name": "粵語 9 聲 6 調是什麼？", "acceptedAnswer": { "@type": "Answer", "text": "粵語有 9 個聲調（普通話只有 4 個），6 個主要韻尾。入聲（-p/-t/-k）也是粵語特色。初學者先掌握 6 調基本框架。" } },
      { "@type": "Question", "name": "零基礎可以學嗎？", "acceptedAnswer": { "@type": "Answer", "text": "可以。入門課程從拼音開始，3 個月內能進行日常自我介紹和簡單對話。建議每天 30 分鐘、每週 25 天。" } },
      { "@type": "Question", "name": "課程有退款嗎？", "acceptedAnswer": { "@type": "Answer", "text": "7 天內不滿意全額退款，無需理由，私訊微信即可。" } },
      { "@type": "Question", "name": "1v1 和視頻課有什麼區別？", "acceptedAnswer": { "@type": "Answer", "text": "視頻課是預錄，隨時學。1v1 直播客製化，適合商務 / 發音矯正 / 短期衝刺需求。" } }
    ]
  }
  </script>
  <script>
    Cantonese.initTheme();
    Cantonese.injectThemeToggle();
    Cantonese.injectTopbar('qa');
    Cantonese.initIcons();
    Cantonese.initScrollReveal();
    Cantonese.applyI18n();

    (async function () {
      try {
        const data = await Cantonese.loadJSON('data/i18n.json');
        await Cantonese.renderQA(document, data);

        // 客服區
        const T = Cantonese.t;
        const wechatDesc = T('contact.wechat-desc');
        const wechatCta  = T('contact.wechat-cta');
        const wechatCopy = T('contact.wechat-copy');
        const wechatId   = T('contact.wechat-id');
        const email      = T('contact.email');
        const emailCta   = T('contact.email-cta');
        const emailCopy  = T('contact.email-copy');
        const emailSend  = T('contact.email-send');
        const teacherNm  = T('contact.teacher-name');
        const hours      = T('contact.hours');
        const replyMsg   = T('contact.reply-msg');
        const copied     = T('contact.copied');
        const rows = document.getElementById('contact-rows');
        rows.innerHTML = `
          <div class="contact-item">
            <div class="icon-wrap">${Cantonese.icon('chat-circle-dots')}</div>
            <div class="label">${wechatCta}</div>
            <div class="value">${wechatId}</div>
            <div class="text-sm muted" style="margin-top: 4px;">${wechatDesc}</div>
            <button class="copy-btn" data-copy="${wechatId}">${wechatCopy}</button>
          </div>
          <div class="contact-item">
            <div class="icon-wrap">${Cantonese.icon('envelope')}</div>
            <div class="label">${emailCta}</div>
            <div class="value" style="font-size: 14px; word-break: break-all;">${email}</div>
            <button class="copy-btn" data-copy="${email}">${emailCopy}</button>
          </div>
          <div class="contact-item">
            <div class="icon-wrap">${Cantonese.icon('chat-circle-dots')}</div>
            <div class="label">${teacherNm}</div>
            <div class="value" style="font-size: 13px; line-height: 1.5;">${replyMsg}</div>
            <a class="copy-btn" style="text-decoration: none; display: inline-block;" href="mailto:${email}">${emailSend}</a>
          </div>
        `;

        // 複製按鈕
        rows.querySelectorAll('.copy-btn[data-copy]').forEach(btn => {
          btn.addEventListener('click', () => {
            const txt = btn.getAttribute('data-copy');
            Cantonese.copyToClipboard(txt).then(() => {
              const orig = btn.textContent;
              btn.textContent = copied;
              setTimeout(() => { btn.textContent = orig; }, 1500);
            });
          });
        });

        document.getElementById('contact-hours').textContent =
          `${hours} · ${replyMsg}`;
      } catch (e) {
        console.error('[qa] error:', e);
        document.getElementById('qa-list').innerHTML =
          `<p style="color: var(--pink);">加載失敗：${e.message}</p>`;
      }
    })();
  </script>
</body>
